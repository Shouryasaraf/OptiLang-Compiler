[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optilang-compiler"
version = "0.3.0"
description = "OptiLang teaching compiler with bytecode VM and visual explorer"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Shourya Saraf"}
]

[project.scripts]
optilang = "optilang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

