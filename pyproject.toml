[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optilang-compiler"
version = "0.2.0"
description = "Phase 2 front end, optimizer and interpreter for the OptiLang teaching compiler"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Shourya Saraf"}
]

[project.scripts]
optilang = "optilang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

